    url: https://www.ncloud.com/support/question
- aid: papago:papago-website-translation
  name: Papago Website Translation API
  description: >-
    Detects and translates HTML documents and web elements using proprietary tag restoration technology
    for improved translation accuracy across websites and web applications, supporting 15 language pairs.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
