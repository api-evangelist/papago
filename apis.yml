    url: https://www.ncloud.com/support/question
- aid: papago:papago-document-translation
  name: Papago Document Translation API
  description: >-
    Translates documents while preserving their original layout, supporting MS Office formats (DOCX, PPTX,
    XLSX), PDF, and Korean Hangul (HWP v5.0+) files up to 100 MB and 300,000 characters per document across
    15 language pairs.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.ncloud-docs.com/docs/en/ai-naver-papagonmt
  baseURL: https://papago.apigw.ntruss.com/doc-trans/v1
  tags:
  - Document Translation
  - File Translation
