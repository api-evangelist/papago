- aid: papago:papago-glossary
  name: Papago Glossary API
  description: >-
    Manages custom terminology dictionaries for contextually appropriate translations. Allows registration
    and retrieval of glossaries with up to 20 terms per request, applied across all Papago translation
    services for consistent domain-specific terminology.
