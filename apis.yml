apis:
- aid: papago:papago-language-detection
  name: Papago Language Detection API
  description: >-
    Automatically detects the language of input text, supporting 15 languages including Korean, English,
    Japanese, Chinese, Vietnamese, Thai, Indonesian, French, Spanish, Russian, German, Italian, Portuguese,
    and Hindi. Language detection is provided at no charge.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.ncloud-docs.com/docs/en/ai-naver-papagonmt
  baseURL: https://papago.apigw.ntruss.com/langs/v1
  tags:
  - Language Detection
  - Natural Language Processing
